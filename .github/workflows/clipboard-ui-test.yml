name: dotSharK clipboard detection test build
on:
  push:
    branches:
      - feature/clipboard-link-attention
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build dotSharK .NET Framework 4.8
        shell: pwsh
        run: |
          dotnet build src\dotSharK.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Test URL acceptance and dark button attention state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assembly = [System.Reflection.Assembly]::LoadFrom((Resolve-Path 'src/bin/Release/dotSharK.exe').Path)
          $type = $assembly.GetType('dotSharK.MainForm', $true)
          $flags = [System.Reflection.BindingFlags]'Static,NonPublic'
          $parse = $type.GetMethod('NormalizeDownloadLink',$flags)
          if ($null -eq $parse) { throw 'Clipboard normalization missing' }
          $positive = @(
            'https://www.youtube.com/watch?v=AbC12345678&list=PLabcXYZ',
            'https://youtu.be/AbC12345678',
            'https://www.bilibili.com/video/BV1xxxxxxxxx/',
            'https://example.org/video/live.m3u8'
          )
          foreach ($value in $positive) {
            $result = $parse.Invoke($null, [object[]]@("  $value  "))
            if ($result -cne $value) { throw "Rejected expected URL: $value ($result)" }
          }
          $negative = @(
            $null,
            '',
            'hello world',
            'not a link https://youtube.com/watch?v=test',
            "https://youtube.com/watch?v=one`nhttps://youtube.com/watch?v=two",
            'ftp://example.org/movie.mkv',
            'file:///C:/movie.mkv',
            'https://username:password@example.com/watch',
            'https://'
          )
          foreach ($value in $negative) {
            if ($null -ne $parse.Invoke($null, [object[]]@($value))) { throw "Accepted invalid clipboard text: $value" }
          }
          $buttonType = $assembly.GetType('dotSharK.DarkButton', $true)
          $button = [Activator]::CreateInstance($buttonType, $true)
          try {
            $props = [System.Reflection.BindingFlags]'Instance,NonPublic'
            $primary = $buttonType.GetProperty('Primary', $props)
            $attention = $buttonType.GetProperty('AttentionHighlight', $props)
            $primary.SetValue($button,$true,$null)
            $button.CreateControl()
            $baseColor = $button.BackColor.ToArgb()
            $attention.SetValue($button,$true,$null)
            $bright = $button.BackColor.ToArgb()
            if ($bright -eq $baseColor) { throw 'Attention highlight did not change button color' }
            $attention.SetValue($button,$false,$null)
            if ($button.BackColor.ToArgb() -ne $baseColor) { throw 'Button did not restore standard accent color' }
          }
          finally { $button.Dispose() }
          Write-Host 'PASS: URL parsing, single-link requirement, scheme rejection, primary attention flash and restore'
      - name: Package UI test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item src\bin\Release\dotSharK.exe package\dotSharK.exe
          Copy-Item README.md package\README.md
          Copy-Item LICENSE package\LICENSE
          Compress-Archive -Path package\* -DestinationPath dotSharK_v1.0.3_Clipboard_TEST.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dotSharK-v1.0.3-clipboard-test
          path: dotSharK_v1.0.3_Clipboard_TEST.zip
          if-no-files-found: error
