name: UI V2 dropdown overflow regression
on:
  push:
    branches:
      - ci/dropdown-overflow-regression-20261117
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build accepted original application and current UI V2 preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -Path ui-v2/DarkComboBox.cs -Pattern 'bool needsScrollbar = items.Count > visible;' -SimpleMatch -Quiet)) {
            throw 'Missing DarkComboBox conditional scrollbar patch'
          }
          dotnet build src/dotSharK.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Accepted application build failed' }
          dotnet build ui-v2/UiV2Stage4Preview.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'UI V2 stage4 preview build failed' }
      - name: Open and inspect actual dropdowns on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          & $compiler /nologo /codepage:65001 /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:ui-v2\bin\Release\DotSharK.UiFoundation.dll /out:DropdownOverflowRegression.exe ci-tests\DropdownOverflowRegression.cs
          if ($LASTEXITCODE -ne 0) { throw 'Dropdown regression harness compile failed' }
          New-Item -ItemType Directory -Force Screenshots | Out-Null
          $env:PATH = (Resolve-Path ui-v2\bin\Release).Path + ';' + $env:PATH
          & .\DropdownOverflowRegression.exe (Resolve-Path Screenshots).Path
          if ($LASTEXITCODE -ne 0) { throw 'Dropdown regression failed' }
      - name: Package executable and screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package\Preview, package\Source | Out-Null
          Copy-Item ui-v2\bin\Release\UiV2Stage4Preview.exe package\Preview
          Copy-Item ui-v2\bin\Release\DotSharK.UiFoundation.dll package\Preview
          Copy-Item ui-v2\DarkComboBox.cs package\Source
          Copy-Item ci-tests\DropdownOverflowRegression.cs package\Source
          Copy-Item Screenshots package\Screenshots -Recurse
          Compress-Archive -Path package\* -DestinationPath dotSharK_UI_V2_DropdownScrollbar_Fix_Test.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dotSharK-ui-v2-dropdown-scrollbar-fix
          path: dotSharK_UI_V2_DropdownScrollbar_Fix_Test.zip
          if-no-files-found: error
